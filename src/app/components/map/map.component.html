<div class="map-wrapper">
  <!-- Map Rotate Wrapper -->
  <div class="map-rotate-wrapper">
    <!-- Leaflet Map Container -->
    <div #mapContainer class="map-container"></div>
  </div>

  <!-- Distance Measurement Overlay Card -->
  @if (measuredDistanceMeters() !== null) {
    <div class="distance-card animate-fade-in">
      <div class="distance-values">
        <div class="primary-dist">
          <span class="value">{{ measuredDistanceMeters() }}</span>
          <span class="unit">m</span>
        </div>
        <div class="secondary-dist">
          <span class="value">{{ measuredDistanceYards() }}</span>
          <span class="unit">yds</span>
        </div>
      </div>
      <button class="clear-btn" (click)="clearMeasurement()" title="Rensa avstånd">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
          <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  }

  <!-- Map Action Controls Overlay -->
  <div class="map-controls">
    <button
      class="control-btn compass-btn"
      [class.active]="rotateToHole"
      (click)="onToggleOrientation()"
      [title]="rotateToHole ? 'Karta: Hålinriktad (Green högst upp). Klicka för Norr Upp' : 'Karta: Norr Upp. Klicka för Hålinriktad'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon compass-icon" [style.transform]="rotateToHole ? 'rotate(0deg)' : 'rotate(-45deg)'">
        <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
      </svg>
    </button>

    @if (hasGreenPosition()) {
      <button class="control-btn green-btn" (click)="centerOnGreen()" title="Återställ hålvy">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="icon">
          <circle cx="12" cy="12" r="7"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
      </button>
    }

    <button class="control-btn gps-btn" (click)="centerOnUser()" title="Centrera på min GPS">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
      </svg>
    </button>
  </div>
</div>
